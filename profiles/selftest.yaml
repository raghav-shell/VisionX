# Self-test profile — used by 'visionsentinel selftest' and the regression suite.
# Fixed seed, every detector enabled, reduced iteration counts so a full run finishes quickly.
extends: baseline
name: selftest
description: >-
  Reproducible self-test: fixed seed, deep budget, reduced iteration counts.
budget: DEEP
seed: 7

analysis:
  track_memory: false

detectors:
  model.trigger_reconstruction:
    params: {steps: 60, batch: 12, clean_samples: 24}
  model.blackbox_stress:
    params: {probes: 48, search_trials: 3}
  model.behaviour_fingerprint:
    params: {max_natural: 24}
