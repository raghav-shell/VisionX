scenario_id: modified_weights
title: Model Parameter Tampering
attack_class: model_weight_tampering
description: Subtle adversarial perturbation applied directly to dense classification layer weights.
seed: 42006
evaluation_family: evaluation

base:
  architecture: visionsentinel.recon_cnn_v1
  class_names:
    - armoured_vehicle
    - truck
    - civilian_vehicle
    - aircraft
    - vessel
    - helicopter
  training_samples: 500
  probe_size: 60

attack:
  type: weight_perturbation
  target_parameters:
    - fc.weight
  noise_scale: 0.15
  training_epochs: 6
  training_threads: 4
  batch_size: 64
  learning_rate: 0.003
  min_probability_delta: 0.05

fitness_gates:
  min_samples: 60
  expected_affected_min: 1

expected:
  truth_tag: model_weight_tampering
  expected_detectors:
    - model.weight_statistics
  expected_min_findings: 1
  expected_disposition: QUARANTINE
