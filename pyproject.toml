[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionsentinel"
version = "1.0.0"
description = "Air-gapped computer-vision integrity and assurance platform for data, models and inference outputs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "kartikeyajay2006" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "defusedxml>=0.7.1",
    "jsonschema>=4.23",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
torch = ["torch>=2.3"]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "httpx>=0.27"]
e2e = ["playwright>=1.47"]

[project.scripts]
visionsentinel = "visionsentinel.cli.main:main"
visionx = "visionsentinel.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visionsentinel = ["py.typed", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
timeout = 600
markers = [
    "slow: long-running scientific or end-to-end test",
    "e2e: browser end-to-end test (requires Playwright browsers and a built dashboard)",
    "requires_torch: needs PyTorch installed",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
